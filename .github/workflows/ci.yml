name: Run Tests CI

on: 
  workflow_dispatch: 
  push:
    branches:
      - main

jobs: 
  build-deploy: 
    runs-on: "ubuntu-latest"

    steps: 
      - name : Checkout Code
        uses : actions/checkout@v3

      - name : Setup Node
        uses : actions/setup-node@v3
        with : 
          node-version: 20
          cache: 'npm'

      - name : Install Dependencies
        run  : npm install

      - name: Start Server and Run Integration Tests
        run: |
          npm start &
          sleep 5
          npm run test
