name: Run Tests CI

on: 
  workflow_dispatch: 
  push:
    branches:
      - main

jobs: 
  build-deploy: 
    runs-on: "ubuntu-latest"

    steps: 
      - name : Checkout Code
        uses : actions/checkout@v3

      - name : Setup Node
        uses : actions/setup-node@v3
        with : 
          node-version: 20
          cache: 'npm'

      - name : Install Dependencies
        run  : npm install

      - name: Start Server and Run Integration Tests
        run: |
          # 1. Start the server in the background using IPv4 forcing if needed
          npm start &
          
          # 2. Wait for it using 127.0.0.1 instead of localhost, auto-confirming npx
          npx --yes wait-on http://127.0.0.1:3000 --timeout 60000
          
          # 3. Trigger your Jest tests
          npm run test
